<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work — focustender</title>
    <link rel="icon" type="image/svg+xml" href="assets/focustendersword.svg" />
    <link rel="stylesheet" href="src/styles/main.css" />
  </head>
  <body>
    <div class="page">
      <nav class="nav nav--overlay" aria-label="Primary">
        <a href="index.html" class="nav__home" aria-label="Home"></a>
        <a href="work.html" aria-current="page">Work</a>
        <a href="design.html">Design</a>
        <button type="button" class="nav__toggle" aria-expanded="false" aria-controls="site-menu" aria-label="Open menu">
          <span class="nav__toggle-bar"></span>
          <span class="nav__toggle-bar"></span>
        </button>
      </nav>

      <main>
        <!-- Title and filters share one row at desktop (title left,
             filters right, flush to the same page margins nav/footer
             use) via .work-header's justify-content:space-between —
             stacked full-width on mobile/tablet instead. -->
        <div class="work-header">
          <!-- Visible now (not sr-only like Design/Ceramics' h1) — its
               text is rewritten by work.js to reflect the active
               Industry filter, "All Work" when none is active. -->
          <h1 class="work-title" id="work-title">All Work</h1>

          <div class="work-filters" role="group" aria-label="Filter projects">
            <div class="work-filters__group">
              <h2 class="work-filters__title">Tools</h2>
              <ul class="work-filters__list" id="filter-tools"></ul>
            </div>
            <div class="work-filters__group">
              <h2 class="work-filters__title">Industry</h2>
              <ul class="work-filters__list" id="filter-industry"></ul>
            </div>
          </div>
        </div>

        <!-- One removable chip per active filter, populated by work.js.
             Reserves its own height even when empty (see CSS) so
             toggling a filter on/off doesn't shift the grid below up
             and down. -->
        <div class="work-active-filters" id="active-filters"></div>

        <!-- Populated by src/work.js from a small data array — see the
             comment there for why the grid is rendered rather than
             hand-authored per tile. -->
        <div class="work-grid" id="work-grid"></div>
      </main>

      <footer class="copyright">
        <p class="copyright__brand">
          <span class="copyright__sword" aria-hidden="true"></span>
          focustender
        </p>
        <p class="copyright__line">© 2026</p>
      </footer>
    </div>

    <div class="site-menu" id="site-menu" role="dialog" aria-modal="true" aria-label="Menu" aria-hidden="true">
      <nav class="site-menu__links" aria-label="Primary">
        <a href="work.html" aria-current="page">Work</a>
        <a href="design.html">Design</a>
      </nav>
      <a href="https://instagram.com/focustender" target="_blank" rel="noopener noreferrer" class="site-menu__contact">Contact</a>
    </div>

    <script type="module" src="src/work.js"></script>
    <script type="module" src="src/nav.js"></script>
  </body>
</html>
