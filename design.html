<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design — focustender</title>
    <link rel="icon" type="image/svg+xml" href="assets/focustendersword.svg" />
    <link rel="stylesheet" href="src/styles/main.css" />
  </head>
  <body>
    <div class="page">
      <nav class="nav nav--overlay" aria-label="Primary">
        <a href="index.html" class="nav__home" aria-label="Home"></a>
        <a href="work.html">Work</a>
        <a href="design.html" aria-current="page">Design</a>
        <a href="ceramics.html">Ceramics</a>
        <button type="button" class="nav__toggle" aria-expanded="false" aria-controls="site-menu" aria-label="Open menu">
          <span class="nav__toggle-bar"></span>
          <span class="nav__toggle-bar"></span>
        </button>
      </nav>

      <main>
        <h1 class="sr-only">Design</h1>
        <!-- Populated automatically from assets/design/ — see assets/design/README.md -->
        <div class="masonry"></div>
      </main>

      <footer class="copyright">
        <p class="copyright__brand">
          <span class="copyright__sword" aria-hidden="true"></span>
          focustender
        </p>
        <p class="copyright__line">© 2026</p>
      </footer>
    </div>

    <!-- Sibling of .page, not a descendant — .page gets blurred when an
         image is expanded (see design.js/subpage.css), and a blurred
         ancestor would blur this too if it were nested inside .page.
         aria-hidden (not the hidden attribute) tracks open/closed state —
         hidden forces display:none, which can't be CSS-transitioned into;
         design.js toggles aria-hidden and an .is-open class together, and
         the fade is handled entirely by opacity/visibility in CSS. -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Expanded image" aria-hidden="true">
      <button type="button" class="lightbox__close" aria-label="Close">×</button>
      <img class="lightbox__image" src="" alt="" />
    </div>

    <!-- Hamburger-triggered curtain menu, mobile/tablet only (<1024px)
         — see the same note on work.html's #site-menu. -->
    <div class="site-menu" id="site-menu" role="dialog" aria-modal="true" aria-label="Menu" aria-hidden="true">
      <nav class="site-menu__links" aria-label="Primary">
        <a href="work.html">Work</a>
        <a href="design.html" aria-current="page">Design</a>
        <a href="ceramics.html">Ceramics</a>
      </nav>
      <a href="https://instagram.com/focustender" target="_blank" rel="noopener noreferrer" class="site-menu__contact">Contact</a>
    </div>

    <script type="module" src="src/design.js"></script>
    <script type="module" src="src/nav.js"></script>
  </body>
</html>
